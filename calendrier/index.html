<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bellevue | Calendrier</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/bellevue_favicon_black_vector.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="brand">
        <a href="../#présentation"><img src="../assets/logo/bellevue_logo_black_vector.svg" alt="Bellevue logo"></a>
      </div>
      <a class="btn primary nav-cta" href="../contact/">Planifier un appel</a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-label="Ouvrir le menu">☰</button>
      <nav class="nav-links">
        <a href="../#présentation">Présentation</a>
        <a href="../#nosvidéos">Création vidéo</a>
        <a href="../pricing/">Tarifs</a>
        <a href="../contact/">Contact</a>
      </nav>
      <div class="nav-actions">
        <a class="btn ghost" href="../pricing/">Voir les tarifs</a>
        <a class="btn primary" href="../contact/">Planifier un appel</a>
      </div>
    </header>

    <main>
      <section class="section calendar">
        <div class="calendar-card reveal" style="--delay: 0s">
          <div class="calendar-intro">
            <p class="eyebrow">Calendrier</p>
            <h2>Réservez un créneau pour votre prochain tournage</h2>
            <p class="lede">Choisissez votre créneau dans le calendrier ci-dessous.</p>
          </div>
          <div class="calendar-embed">
            <!-- Cal inline embed code begins -->
            <div style="width:100%;height:100%;overflow:scroll" id="my-cal-inline-shootingvideo"></div>
            <script type="text/javascript">
              (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.eu/embed/embed.js", "init");
              Cal("init", "shootingvideo", { origin: "https://app.cal.eu" });

              Cal.ns.shootingvideo("inline", {
                elementOrSelector: "#my-cal-inline-shootingvideo",
                config: { "layout": "month_view", "theme": "light" },
                calLink: "bellevue/shootingvideo",
              });

              Cal.ns.shootingvideo("ui", { "theme": "light", "hideEventTypeDetails": false, "layout": "month_view" });
            </script>
            <!-- Cal inline embed code ends -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../script.js"></script>
</body>
</html>
